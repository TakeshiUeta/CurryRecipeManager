<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Waterless Curry Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/css/recipe.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container mt-4">
      <header class="bg-warning-subtle py-3 mb-4">
        <div class="container">
          <h1 class="mb-0">🍛 Waterless Curry Management</h1>
        </div>
      </header>
      <div class="mt-5 mb-4 border-bottom pb-2">
        <h3>📖 レシピ一覧</h3>
      </div>
      <div
        class="card shadow-sm mb-4 recipe-card col-md-9 mx-auto"
        th:each="recipe : ${recipeList.recipes}"
      >
        <div class="card-header bg-success-subtle text-secondary-emphasis">
          <button
            class="btn w-100 text-start recipe-title"
            type="button"
            data-bs-toggle="collapse"
            th:data-bs-target="'#recipe-' + ${recipe.id}"
          >
            <span class="me-2 toggle-icon">＋</span>
            <span class="me-2">🍛</span>
            <span class="recipe-title" th:text="${recipe.recipeName}">
              レシピ名
            </span>
          </button>
        </div>
        <!-- レシピ基本情報 -->
        <div class="collapse" th:id="'recipe-' + ${recipe.id}">
          <div class="card-body">
            <p class="card-text">
              調理時間： 🕒 <span th:text="${recipe.cookingTime}"></span> 分
            </p>
            <p class="card-text">
              評価： ⭐
              <span
                class="badge bg-warning text-dark"
                th:if="${recipe.evaluation == 5}"
                >★★★★★</span
              >
              <span
                class="badge bg-warning text-dark"
                th:if="${recipe.evaluation == 4}"
                >★★★★☆</span
              >
              <span
                class="badge bg-warning text-dark"
                th:if="${recipe.evaluation == 3}"
                >★★★☆☆</span
              >
              <span
                class="badge bg-warning text-dark"
                th:if="${recipe.evaluation == 2}"
                >★★☆☆☆</span
              >
              <span
                class="badge bg-warning text-dark"
                th:if="${recipe.evaluation == 1}"
                >★☆☆☆☆</span
              >
            </p>
            <!-- 材料一覧 -->
            <h5 class="border-bottom pb-2 mt-4">🥕 材料一覧</h5>
            <div
              class="d-flex align-items-center gap-2 mb-2"
              th:each="ingredient : ${recipe.ingredients}"
            >
              <form
                class="d-flex align-items-center gap-2"
                th:action="@{/recipe/ingredient/update}"
                method="post"
              >
                <input type="hidden" name="id" th:value="${ingredient.id}" />
                <input
                  type="hidden"
                  name="recipeId"
                  th:value="${ingredient.recipeId}"
                />
                <div class="col-auto">
                  <input
                    class="form-control ingredient-name-input"
                    type="text"
                    name="ingredientName"
                    th:value="${ingredient.ingredientName}"
                    placeholder="材料名"
                  />
                </div>
                <div class="col-auto">
                  <input
                    class="form-control ingredient-amount-input"
                    name="amount"
                    th:value="${ingredient.amount}"
                    placeholder="分量"
                  />
                </div>
                <div class="col-auto">
                  <input
                    class="form-control ingredient-unit-input"
                    name="unit"
                    th:value="${ingredient.unit}"
                    placeholder="単位"
                  />
                </div>
                <div class="col-auto">
                  <button
                    type="submit"
                    class="btn btn-primary btn-sm recipe-action-button"
                  >
                    保存
                  </button>
                </div>
              </form>
              <form th:action="@{/recipe/ingredient/delete}" method="post">
                <input type="hidden" name="id" th:value="${ingredient.id}" />
                <button
                  type="submit"
                  class="btn btn-danger btn-sm recipe-action-button"
                >
                  削除
                </button>
              </form>
            </div>
            <!-- 材料追加 -->
            <form
              class="d-flex align-items-center gap-2 flex-wrap"
              th:action="@{/recipe/ingredient/insert}"
              method="post"
            >
              <input type="hidden" name="recipeId" th:value="${recipe.id}" />
              <div class="col-auto">
                <input
                  class="form-control ingredient-name-input"
                  type="text"
                  name="ingredientName"
                  placeholder="材料名"
                />
              </div>
              <div class="col-auto">
                <input
                  class="form-control ingredient-amount-input"
                  type="text"
                  name="amount"
                  placeholder="分量"
                />
              </div>
              <div class="col-auto">
                <input
                  class="form-control ingredient-unit-input"
                  type="text"
                  name="unit"
                  placeholder="単位"
                />
              </div>
              <div class="col-auto">
                <button
                  type="submit"
                  class="btn btn-success recipe-action-button"
                >
                  材料追加
                </button>
              </div>
            </form>
            <!-- 調理手順一覧 -->
            <h5 class="border-bottom pb-2 mt-4">🍛 調理手順</h5>
            <div
              class="d-flex align-items-center gap-2 mb-2"
              th:each="step : ${recipe.recipeSteps}"
            >
              <form
                class="d-flex align-items-center gap-2"
                th:action="@{/recipe/recipeStep/update}"
                method="post"
              >
                <input type="hidden" name="id" th:value="${step.id}" />
                <input
                  type="hidden"
                  name="recipeId"
                  th:value="${step.recipeId}"
                  placeholder="レシピID"
                />
                <div class="col-auto">
                  <input
                    class="form-control recipe-step-number"
                    type="number"
                    name="stepNo"
                    th:value="${step.stepNo}"
                    placeholder="手順番号"
                  />
                </div>
                <div class="col-auto">
                  <textarea
                    class="form-control recipe-step-content"
                    name="content"
                    th:text="${step.content}"
                    placeholder="手順内容"
                  ></textarea>
                </div>
                <div class="col-auto">
                  <button
                    type="submit"
                    class="btn btn-primary btn-sm recipe-action-button"
                  >
                    保存
                  </button>
                </div>
              </form>
              <form th:action="@{/recipe/recipeStep/delete}" method="post">
                <input type="hidden" name="id" th:value="${step.id}" />
                <div class="col-auto">
                  <button
                    type="submit"
                    class="btn btn-danger btn-sm recipe-action-button"
                  >
                    削除
                  </button>
                </div>
              </form>
            </div>
            <!-- 手順追加 -->
            <form
              class="d-flex align-items-center gap-2 flex-wrap"
              th:action="@{/recipe/recipeStep/insert}"
              method="post"
            >
              <input type="hidden" name="recipeId" th:value="${recipe.id}" />
              <div class="col-auto">
                <input
                  class="form-control recipe-step-number"
                  type="number"
                  name="stepNo"
                  placeholder="番号"
                />
              </div>
              <div class="col-auto">
                <textarea
                  class="form-control recipe-step-content"
                  name="content"
                  placeholder="手順"
                ></textarea>
              </div>
              <div class="col-auto">
                <button
                  type="submit"
                  class="btn btn-success recipe-action-button"
                >
                  手順追加
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- レシピ登録 -->
      <section>
        <div class="card shadow-sm mt-4 recipe-card col-md-9 mx-auto">
          <div class="card-header bg-primary-subtle text-primary">
            <h3 class="mb-0">📝 新規登録</h3>
          </div>
          <form
            th:action="@{/recipe/insert}"
            th:object="${recipeForm}"
            method="post"
          >
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label">レシピ名</label>
                <input
                  type="text"
                  th:field="*{recipeName}"
                  class="form-control recipe-form-input"
                />
              </div>
              <div class="mb-3">
                <label class="form-label">調理時間</label>
                <input
                  type="number"
                  th:field="*{cookingTime}"
                  class="form-control recipe-form-input"
                />
              </div>
              <div class="mb-3">
                <label class="form-label">評価</label>
                <select
                  th:field="*{evaluation}"
                  class="form-select recipe-form-input"
                >
                  <option value="1">★☆☆☆☆</option>
                  <option value="2">★★☆☆☆</option>
                  <option value="3">★★★☆☆</option>
                  <option value="4">★★★★☆</option>
                  <option value="5">★★★★★</option>
                </select>
              </div>
              <button
                type="submit"
                class="btn btn-primary recipe-action-button"
              >
                登録
              </button>
            </div>
          </form>
        </div>
      </section>
    </div>
    <footer class="text-center mt-5 mb-3 text-muted">
      © 2026 Waterless Curry Management
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.querySelectorAll(".collapse").forEach(function (collapse) {
        collapse.addEventListener("show.bs.collapse", function () {
          const button = document.querySelector(
            '[data-bs-target="#' + collapse.id + '"]',
          );

          button.querySelector(".toggle-icon").textContent = "－";
        });

        collapse.addEventListener("hide.bs.collapse", function () {
          const button = document.querySelector(
            '[data-bs-target="#' + collapse.id + '"]',
          );

          button.querySelector(".toggle-icon").textContent = "＋";
        });
      });
    </script>
  </body>
</html>
