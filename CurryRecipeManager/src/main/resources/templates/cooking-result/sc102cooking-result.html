<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Cooking Result</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/css/recipe.css" rel="stylesheet" />
    <link href="/css/cooking-result.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container mt-4">
      <header class="bg-warning-subtle py-3 mb-4">
        <div class="container">
          <h1 class="mb-0">🍛 Cooking Result</h1>
        </div>
      </header>
    </div>
    <!-- レシピ登録 -->
    <div class="container mt-5">
      <section>
        <div class="card shadow-sm mt-4 col-md-9 mx-auto">
          <div class="card-header bg-primary-subtle text-primary">
            <h3 class="mb-0">📝 新規登録</h3>
          </div>

          <form
            th:action="@{/cooking-result/insert}"
            th:object="${cookingResultForm}"
            method="post"
          >
            <div class="card-body px-4">
              <input type="hidden" th:field="*{recipeId}" />

              <div class="mb-3">
                <label class="form-label"> 調理日付 </label>
                <input
                  type="date"
                  th:field="*{cookedDate}"
                  class="form-control"
                />
                <div class="text-danger" th:errors="*{cookedDate}"></div>
              </div>

              <div class="mb-3">
                <label class="form-label"> 出来栄え評価 </label>
                <select th:field="*{score}" class="form-select">
                  <option value="1">★☆☆☆☆</option>
                  <option value="2">★★☆☆☆</option>
                  <option value="3">★★★☆☆</option>
                  <option value="4">★★★★☆</option>
                  <option value="5">★★★★★</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label"> メモ </label>
                <textarea
                  th:field="*{memo}"
                  class="form-control"
                  rows="3"
                ></textarea>
                <div class="text-danger" th:errors="*{memo}"></div>
              </div>

              <button
                type="submit"
                class="btn btn-primary recipe-action-button"
              >
                登録
              </button>
            </div>
          </form>
        </div>
      </section>
      <div class="col-md-9 mx-auto mt-5 mb-3">
        <h3 class="mb-3">📖 調理結果一覧</h3>
      </div>
      <!-- レシピ名 -->
      <div class="card shadow-sm mt-3 mb-4 col-md-9 mx-auto">
        <div class="card-header bg-success-subtle">
          <h5 class="mb-0">
            <span class="me-2">🍛</span>
            <span th:text="${dto.recipeName}"></span>
          </h5>
        </div>

        <!-- 調理結果の表示 -->
        <div th:each="result : ${dto.results}" class="card mb-3 shadow-sm">
          <!-- 開閉ボタン -->
          <div class="card-header bg-success-subtle text-secondary-emphasis">
            <button
              class="btn w-100 d-flex justify-content-between align-items-center text-decoration-none text-dark"
              type="button"
              data-bs-toggle="collapse"
              th:data-bs-target="'#result-' + ${result.id}"
            >
              <span>
                <span th:text="${result.cookedDate}"></span>

                <span class="ms-2" th:switch="${result.score}">
                  <span th:case="1">★☆☆☆☆</span>
                  <span th:case="2">★★☆☆☆</span>
                  <span th:case="3">★★★☆☆</span>
                  <span th:case="4">★★★★☆</span>
                  <span th:case="5">★★★★★</span>
                </span>
              </span>
              <span class="toggle-icon">＋</span>
            </button>
          </div>
          <!-- 折りたたみ対象 -->
          <div
            th:id="'result-' + ${result.id}"
            class="collapse"
            th:classappend="${openResultId == result.id} ? ' show'"
          >
            <div class="card-body">
              <!-- 更新フォーム -->
              <form
                th:id="'updateForm-' + ${result.id}"
                th:action="@{/cooking-result/update}"
                method="post"
              >
                <input type="hidden" name="id" th:value="${result.id}" />
                <input
                  type="hidden"
                  name="recipeId"
                  th:value="${dto.recipeId}"
                />

                <div class="row g-3">
                  <div class="col-md-3">
                    <label class="form-label">調理日</label>
                    <input
                      type="date"
                      name="cookedDate"
                      class="form-control"
                      th:value="${result.cookedDate}"
                    />
                    <div
                      class="text-danger error-message"
                      th:text="${result.cookedDateError}"
                    ></div>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">評価</label>
                    <select name="score" class="form-select">
                      <option value="1" th:selected="${result.score == 1}">
                        ★☆☆☆☆
                      </option>
                      <option value="2" th:selected="${result.score == 2}">
                        ★★☆☆☆
                      </option>
                      <option value="3" th:selected="${result.score == 3}">
                        ★★★☆☆
                      </option>
                      <option value="4" th:selected="${result.score == 4}">
                        ★★★★☆
                      </option>
                      <option value="5" th:selected="${result.score == 5}">
                        ★★★★★
                      </option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">メモ</label>
                    <div>
                      <textarea
                        name="memo"
                        class="form-control"
                        rows="3"
                        th:text="${result.memo}"
                      ></textarea>
                    </div>
                    <div
                      class="text-danger error-message"
                      th:text="${result.memoError}"
                    ></div>
                  </div>
                </div>
              </form>
              <form
                th:id="'deleteForm-' + ${result.id}"
                th:action="@{/cooking-result/delete}"
                onsubmit="return confirm('この調理結果を削除しますか？');"
                method="post"
              >
                <input type="hidden" name="id" th:value="${result.id}" />
                <input
                  type="hidden"
                  name="recipeId"
                  th:value="${dto.recipeId}"
                />
              </form>
              <div class="d-flex gap-2 mt-3">
                <button
                  type="submit"
                  th:form="'updateForm-' + ${result.id}"
                  class="btn btn-success px-4"
                >
                  保存
                </button>
                <button
                  th:form="'deleteForm-' + ${result.id}"
                  type="submit"
                  class="btn btn-danger px-4"
                >
                  削除
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="text-center mt-4 mb-4">
      <a th:href="@{/recipe/sc101recipe-list}" class="btn btn-secondary px-4">
        一覧に戻る
      </a>
    </div>
    <footer class="text-center mt-5 mb-3 text-muted">
      © 2026 Waterless Curry Management
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.querySelectorAll(".collapse").forEach(function (collapse) {
        collapse.addEventListener("show.bs.collapse", function () {
          const button = document.querySelector(
            '[data-bs-target="#' + collapse.id + '"]',
          );

          button.querySelector(".toggle-icon").textContent = "－";
        });

        collapse.addEventListener("hide.bs.collapse", function () {
          const button = document.querySelector(
            '[data-bs-target="#' + collapse.id + '"]',
          );

          button.querySelector(".toggle-icon").textContent = "＋";
        });
      });
    </script>
  </body>
</html>
