<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>システムエラー</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">
          <h4 class="mb-0">システムエラー</h4>
        </div>

        <div class="card-body text-center">
          <p class="text-muted">指定されたデータが見つかりませんでした。</p>

          <p class="fs-5" th:text="${errorMessage}"></p>

          <a class="btn btn-primary" th:href="@{/recipe/sc101recipe-list}">
            トップへ戻る
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
